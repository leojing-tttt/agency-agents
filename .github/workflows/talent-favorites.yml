name: Talent Favorites

on:
  pull_request:
    paths:
      - "apps/talent-favorites/**"
      - ".github/workflows/talent-favorites.yml"
  push:
    paths:
      - "apps/talent-favorites/**"
      - ".github/workflows/talent-favorites.yml"

jobs:
  test:
    name: Slice tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/talent-favorites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/talent-favorites/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
