name: Campaign Agent

on:
  pull_request:
    paths:
      - "apps/campaign-agent/**"
      - ".github/workflows/campaign-agent.yml"
  push:
    paths:
      - "apps/campaign-agent/**"
      - ".github/workflows/campaign-agent.yml"

jobs:
  test:
    name: Slice tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/campaign-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/campaign-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
