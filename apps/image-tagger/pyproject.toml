[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-tagger"
version = "0.1.0"
description = "Project image library tagger with taxonomy management and local Ollama vision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
image-tagger = "image_tagger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_tagger = ["../data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
